syntax = "proto3";

package vtuber_image.v1;

// ImageGeneratorService defines how vtuber-brain or vtuber-api requests
// images from vtuber-image.
service ImageGeneratorService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}

message GenerateRequest {
  // UUID or stable ID for the persona.
  string persona_id = 1;
  // Visual overrides for this specific generation.
  PersonaOverrides overrides = 2;
}

message PersonaOverrides {
  string hair_style = 1;
  string eye_color = 2;
  string outfit = 3;
}

message GenerateResponse {
  // URL or path to the generated image.
  string image_url = 1;
  // Key-value pairs for provenance and workflow metadata.
  map<string, string> metadata = 2;
}

