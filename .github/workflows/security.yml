name: Security Audit
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  security-smoke-test:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baseline check
        run: echo "OK — security baseline passed. Language-specific audit jobs below run only when their manifest exists."

  
  rust-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cargo.toml
        id: guard
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::No Cargo.toml yet; skipping cargo-audit."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        if: steps.guard.outputs.skip != 'true'
        run: cargo install cargo-audit
      - name: Run audit
        if: steps.guard.outputs.skip != 'true'
        run: cargo audit
  
  rust-clippy-security:
    name: Rust Static Analysis (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cargo.toml
        id: guard
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::No Cargo.toml yet; skipping clippy SARIF."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install SARIF tools
        if: steps.guard.outputs.skip != 'true'
        run: cargo install clippy-sarif sarif-fmt
      - name: Clippy SARIF
        if: steps.guard.outputs.skip != 'true'
        run: >
          cargo clippy --all-targets --all-features --message-format=json
          | clippy-sarif
          | tee results.sarif
          | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF
        if: steps.guard.outputs.skip != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  
  mojo-security:
    name: Mojo Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mojo static analysis (skipped until mojoproject.toml exists)
        env:
          MODULAR_AUTH: ${{ secrets.MODULAR_AUTH_TOKEN }}
        run: |
          if [ ! -f mojoproject.toml ]; then
            echo "::notice::No mojoproject.toml yet; skipping Mojo static analysis."
            exit 0
          fi
          curl -fsSL https://get.modular.com -o install-modular.sh
          sh install-modular.sh
          export PATH="$HOME/.modular/bin:$PATH"
          modular install mojo
          mojo check .

  
  buf-schema-baseline:
    name: buf Schema Security Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no buf.yaml
        id: guard
        run: |
          if [ ! -f buf.yaml ] && [ ! -f buf.yml ]; then
            echo "::notice::No buf.yaml yet; skipping schema security baseline."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup buf
        if: steps.guard.outputs.skip != 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint schema (security pass)
        if: steps.guard.outputs.skip != 'true'
        run: buf lint

