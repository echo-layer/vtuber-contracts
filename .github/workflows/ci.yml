name: "CI for vtuber-contracts"
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bootstrap-smoke-test:
    name: Bootstrap smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect source stacks
        id: stacks
        run: |
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "python=$({ [ -f pyproject.toml ] || [ -f requirements.txt ]; } && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "node=$([ -f package.json ] && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Verify repo structure
        run: |
          echo "rust=${{ steps.stacks.outputs.rust }} python=${{ steps.stacks.outputs.python }} node=${{ steps.stacks.outputs.node }}"
          echo "OK — repo structure verified. Stack-specific jobs below run only if their manifest exists."

  
  rust-lint:
    name: Rust Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cargo.toml
        id: guard
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::No Cargo.toml yet; skipping Rust lint."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        if: steps.guard.outputs.skip != 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.guard.outputs.skip != 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
  
  rust-build-and-test:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no Cargo.toml
        id: guard
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::notice::No Cargo.toml yet; skipping Rust build/test."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Rust
        if: steps.guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: cargo build
      - name: Test
        if: steps.guard.outputs.skip != 'true'
        run: cargo test

  
  mojo-build:
    name: Mojo Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no pixi.toml
        id: guard
        run: |
          if [ ! -f pixi.toml ]; then
            echo "::notice::No pixi.toml yet; skipping Mojo build/test."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup Pixi
        if: steps.guard.outputs.skip != 'true'
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install dependencies (pixi install)
        if: steps.guard.outputs.skip != 'true'
        run: pixi install
      - name: Mojo check (pixi run check)
        if: steps.guard.outputs.skip != 'true'
        run: |
          # The `check` task is expected to exist in every Mojo repo's pixi.toml
          # and to run `mojo format --check` + any static analysis. If the task
          # is missing the repo's build is incomplete — fail loudly, don't skip.
          pixi run check
      - name: Mojo test (pixi run test)
        if: steps.guard.outputs.skip != 'true'
        run: pixi run test

  
  buf-lint:
    name: buf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no buf.yaml
        id: guard
        run: |
          if [ ! -f buf.yaml ] && [ ! -f buf.yml ]; then
            echo "::notice::No buf.yaml yet; skipping buf lint."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup buf
        if: steps.guard.outputs.skip != 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        if: steps.guard.outputs.skip != 'true'
        run: buf lint
  
  buf-breaking:
    name: buf Breaking-Change Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if no buf.yaml
        id: guard
        run: |
          if [ ! -f buf.yaml ] && [ ! -f buf.yml ]; then
            echo "::notice::No buf.yaml yet; skipping buf breaking."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup buf
        if: steps.guard.outputs.skip != 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve baseline ref
        if: steps.guard.outputs.skip != 'true'
        id: baseline
        run: |
          # Pull requests: compare against the merge base with the PR target branch.
          # Pushes to main/master: compare against the previous commit (HEAD~1) when
          # one exists; on the very first commit, there is nothing to compare so
          # skip the job rather than fail the initial bootstrap push.
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=50
            ref="origin/${{ github.base_ref }}"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              ref="HEAD~1"
            else
              echo "::notice::No prior commit; skipping breaking-change check for initial commit."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "ref=$ref" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
      - name: Breaking-change check
        if: steps.guard.outputs.skip != 'true' && steps.baseline.outputs.skip != 'true'
        run: buf breaking --against ".git#ref=${{ steps.baseline.outputs.ref }}"
  
  buf-generate:
    name: buf Generate (dry-run verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no buf.gen.yaml
        id: guard
        run: |
          if [ ! -f buf.gen.yaml ]; then
            echo "::notice::No buf.gen.yaml yet; skipping buf generate."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Setup buf
        if: steps.guard.outputs.skip != 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and verify no drift
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Regenerate into a scratch dir and diff against committed generated/.
          # If generated artifacts are committed (they should be for lockstep
          # SDK consumers), any drift between proto changes and regeneration
          # must fail CI — a reviewer should not have to run buf generate by hand.
          buf generate --template buf.gen.yaml
          if [ -d generated ] && ! git diff --quiet --exit-code -- generated/; then
            echo "::error::generated/ is out of sync with proto/. Run 'buf generate' locally and commit the result."
            git diff --stat -- generated/
            exit 1
          fi

