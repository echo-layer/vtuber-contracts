[package]
name = "vtuber-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Typed interface contracts (proto3) for the vtuber-* program — generates a Rust crate, Python typed stubs, and TypeScript declarations consumed by every other vtuber-* repo."
license = "MIT"
repository = "https://github.com/echo-layer/vtuber-contracts"
readme = "README.md"
keywords = ["vtuber", "grpc", "protobuf", "contracts"]
categories = ["api-bindings"]

[dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

[dev-dependencies]
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
